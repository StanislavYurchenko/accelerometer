<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Activity Tracker (ONNX)</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>

<div class="container">
    <h2>Activity Status - v4:</h2>
    <div id="status">Loading AI...</div>
    <button id="startBtn">Enable Sensors</button>
    
    <div class="debug-panel">
        <h3>📊 Real-time metrics:</h3>
        <p>Points collected in window: <span id="windowProgress">0</span> / 80</p>
        <p>Current Magnitude: <span id="currentMag">0.00</span></p>
        <p>Last 15 features (1 cycle):</p>
        <pre id="featuresDebug">Waiting for the first window...</pre>
        <button id="copyBtn" style="margin-top: 10px; padding: 10px 20px; font-size: 0.9rem; background: #10b981;">📋 Copy array</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
